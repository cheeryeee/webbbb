name: Unpack portfolio source

on:
  push:

permissions:
  contents: write

jobs:
  unpack:
    if: github.event.head_commit.message == 'Fix unpack workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Rebuild and unpack source archive
        shell: bash
        run: |
          cat portfolio-source.zip.part-* > portfolio-source.zip
          unzip -q -o portfolio-source.zip
          rm -f portfolio-source.zip portfolio-source.zip.part-*
      - name: Commit complete source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack complete portfolio source"
          git push
